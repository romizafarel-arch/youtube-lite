name: Build YouTube Lite APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Easy Install
        working-directory: android/app/build/outputs/apk/debug
        run: mv app-debug.apk YouTubeLite.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeLite-APK
          path: android/app/build/outputs/apk/debug/YouTubeLite.apk
          retention-days: 14
